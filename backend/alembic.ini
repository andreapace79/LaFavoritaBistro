# ============================================================================
# Alembic configuration file for the Gestionale Bistrò backend
# ============================================================================
[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate new migration files
# Uncomment to use timestamp naming convention
# file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Enable or disable autogenerate metadata comparison
# (set to 'True' if you want Alembic to detect model changes automatically)
revision_environment = True

# ============================================================================
# Database connection
# ============================================================================
# Connection string for PostgreSQL (Docker setup)
sqlalchemy.url = postgresql://postgres:postgres@db:5432/bistro

# If you’re testing locally without Docker, use:
# sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/bistro
# ============================================================================

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s [%(levelname)s] %(name)s - %(message)s

