version: "3.9"

services:
  db:
    image: postgres:15
    container_name: bistro-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bistrodb
    ports:
      - "55432:5432"   # VM -> container
    volumes:
      - ./db/data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bistro-backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/bistrodb
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./docs:/app/docs
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
