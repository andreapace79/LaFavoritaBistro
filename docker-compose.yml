
services:
  db:
    image: postgres:15
    container_name: bistro-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bistrodb
    ports:
      - "55432:5432"       # ✅ host 55432 → container 5432
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bistro-backend
    restart: always
    environment:
      # usa le tue var/connessione come fa core.config/db
      DB_HOST: db          # ✅ dentro la rete docker
      DB_PORT: 5432        # ✅ porta interna del container Postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bistrodb
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./docs:/app/docs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bistro-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules

volumes:
  db_data: